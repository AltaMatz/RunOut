{% extends "base.html" %}

{% block title %}Piantina - Runout{% endblock %}

{% block content %}
<div class="page-container">
    <div class="piantina-section">

        <div class="piantina-header">
            <p>Consulta le planimetrie dell'istituto per edificio e piano.</p>
        </div>

        <div class="content">
            <p class="section-label">Seleziona edificio</p>

            <div class="map-tabs" role="tablist" aria-label="Selezione planimetria">
                <button class="map-tab is-active" type="button" data-key="integrale">Piantina integrale</button>
                <button class="map-tab" type="button" data-key="centrale">Sede centrale</button>
                <button class="map-tab" type="button" data-key="elettronica">Palazzina elettronica</button>
                <button class="map-tab" type="button" data-key="meccanica">Palazzina meccanica</button>
                <button class="map-tab" type="button" data-key="tessile">Palazzina tessile</button>
                <button class="map-tab" type="button" data-key="informatica">Palazzina informatica</button>
            </div>

            <div class="map-gallery" id="mapGallery" aria-live="polite"></div>
        </div>

    </div>
</div>

<style>
.piantina-section {
    background: #f5f6f0;
    min-height: 100vh;
}

.piantina-header {
    background: #ffffff;
    border-bottom: 1px solid #e8e9e3;
    padding: 48px 40px;
    text-align: center;
}

.piantina-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
}

.logo-text {
    font-size: 17px;
    font-weight: 600;
    color: #242935;
}

.piantina-header p {
    font-size: 20px;
    font-weight: 500;
    color: #242935;
    margin: 0;
    line-height: 1.4;
}

.content {
    padding: 32px 40px 40px;
}

.section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8a8f7a;
    margin-bottom: 16px;
}

.map-tabs {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 24px;
}

.map-tab {
    background: #ffffff;
    border: 1px solid #e8e9e3;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #5c6250;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    text-align: center;
}

.map-tab:hover {
    border-color: #c5db3a;
    color: #242935;
}

.map-tab:focus-visible {
    outline: 2px solid #e2f75c;
    outline-offset: 2px;
}

.map-tab.is-active {
    background: #242935;
    color: #e2f75c;
    border-color: #242935;
}

.map-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
}

.map-card {
    flex: 1 1 460px;
    max-width: 540px;
    background: #ffffff;
    border: 1px solid #e8e9e3;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
}

.map-card:hover {
    border-color: #c5db3a;
    box-shadow: 0 2px 12px rgba(226, 247, 92, 0.18);
}

.map-card-title {
    margin: 0;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #e2f75c;
    border-bottom: 1px solid #e8e9e3;
    background: #f5f6f0;
}

.map-image-wrap {
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
}

.map-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
}

.map-card-actions {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e8e9e3;
    background: #f5f6f0;
    flex-wrap: wrap;
}

.map-link {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    background: #242935;
    color: #e2f75c;
    transition: background 0.15s;
}

.map-link:hover {
    background: #1a1f28;
}

.map-link-secondary {
    background: #ffffff;
    color: #e2f75c;
    border: 1px solid #e8e9e3;
}

.map-link-secondary:hover {
    background: #f5f6f0;
    border-color: #c5db3a;
}

@media (max-width: 1100px) {
    .map-tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    .map-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .content {
        padding: 24px 20px 32px;
    }
    .piantina-header {
        padding: 20px;
    }
    .map-card {
        flex-basis: 100%;
        max-width: 100%;
    }
    .map-image-wrap {
        height: 260px;
    }
}

@media (max-width: 480px) {
    .map-tabs {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
    const floorLabel = {
        primo: "Piano terra",
        secondo: "Primo piano",
        terzo: "Secondo piano",
        quarto: "Terzo piano"
    };

    const plansBySection = {
        integrale: {
            sectionTitle: "Piantina integrale",
            images: [
                { file: "piantina.jpg", title: "Piantina integrale" }
            ]
        },
        centrale: {
            sectionTitle: "Sede centrale",
            images: [
                { file: "centrale_primo.jpg", title: floorLabel.primo },
                { file: "centrale_secondo.jpg", title: floorLabel.secondo },
                { file: "centrale_terzo.jpg", title: floorLabel.terzo },
                { file: "centrale_quarto.jpg", title: floorLabel.quarto }
            ]
        },
        elettronica: {
            sectionTitle: "Palazzina elettronica",
            images: [
                { file: "elettronica_primo.jpg", title: floorLabel.primo },
                { file: "elettronica_secondo.jpg", title: floorLabel.secondo },
                { file: "elettronica_terzo.jpg", title: floorLabel.terzo }
            ]
        },
        meccanica: {
            sectionTitle: "Palazzina meccanica",
            images: [
                { file: "meccanica_primo.jpg", title: floorLabel.primo },
                { file: "meccanica_secondo.jpg", title: floorLabel.secondo },
                { file: "meccanica_terzo.jpg", title: floorLabel.terzo }
            ]
        },
        tessile: {
            sectionTitle: "Palazzina tessile",
            images: [
                { file: "tessile_primo.jpg", title: floorLabel.primo },
                { file: "tessile_secondo.jpg", title: floorLabel.secondo },
                { file: "tessile_terzo.jpg", title: floorLabel.terzo }
            ]
        },
        informatica: {
            sectionTitle: "Palazzina informatica",
            images: [
                { file: "informatica_primo.jpg", title: floorLabel.primo },
                { file: "informatica_secondo.jpg", title: floorLabel.secondo },
                { file: "informatica_terzo.jpg", title: floorLabel.terzo }
            ]
        }
    };

    const baseImagePath = "{{ url_for('static', filename='images') }}";
    const gallery = document.getElementById("mapGallery");
    const tabs = document.querySelectorAll(".map-tab");

    function renderSection(sectionKey) {
        const selected = plansBySection[sectionKey];
        if (!selected) return;

        gallery.innerHTML = selected.images.map((img) => {
            const src = `${baseImagePath}/${img.file}`;
            return `
                <article class="map-card">
                    <h3 class="map-card-title">${selected.sectionTitle} — ${img.title}</h3>
                    <div class="map-image-wrap">
                        <img class="map-image" src="${src}" alt="${selected.sectionTitle} ${img.title}">
                    </div>
                    <div class="map-card-actions">
                        <a href="${src}" target="_blank" rel="noopener" class="map-link">Apri immagine</a>
                        <a href="${src}" download class="map-link map-link-secondary">Scarica immagine</a>
                    </div>
                </article>
            `;
        }).join("");

        tabs.forEach((tab) => {
            tab.classList.toggle("is-active", tab.dataset.key === sectionKey);
        });
    }

    tabs.forEach((tab) => {
        tab.addEventListener("click", () => renderSection(tab.dataset.key));
    });

    renderSection("integrale");
</script>
{% endblock %}
